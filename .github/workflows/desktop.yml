name: Desktop installers

on:
  workflow_dispatch:
    inputs:
      release:
        description: Build release artifacts and create a draft after all checks pass
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      PDFER_RELEASE: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.release) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.28'
          python-version: '3.14'
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) throw Error('Tag must match package.json version')"
      - name: Install native build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install tesseract qpdf
          echo "QPDF_SOURCE_TREE=$(brew --prefix qpdf)" >> "$GITHUB_ENV"
          echo "QPDF_BUILD_LIBDIR=$(brew --prefix qpdf)/lib" >> "$GITHUB_ENV"
      - name: Install OCR build dependency (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-osd libfuse2 xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libasound2
      - name: Install OCR build dependency (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          'C:\Program Files\Tesseract-OCR' | Out-File -FilePath $env:GITHUB_PATH -Append
      - run: pnpm install --frozen-lockfile
      - name: Test Python engine
        run: node desktop/tests/python-ci.cjs
        timeout-minutes: 15
      - name: Test frontend
        run: pnpm --filter pdfer-frontend test
        timeout-minutes: 5
      - name: Test desktop integration
        run: pnpm desktop:test
        timeout-minutes: 5
      - run: pnpm --filter pdfer-frontend lint
      - name: Prepare Apple notarization key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          encoded = os.environ.get('APPLE_API_KEY_BASE64', '')
          if not encoded:
              raise SystemExit(0)
          key = Path(os.environ['RUNNER_TEMP']) / 'notarization.p8'
          key.write_bytes(base64.b64decode(encoded, validate=True))
          key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'APPLE_API_KEY={key}\n')
          PY
      - name: Build Mac installers and signed Sparkle feeds
        if: runner.os == 'macOS'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm desktop:build
      - name: Build Windows installers (sign when a certificate is configured)
        if: runner.os == 'Windows'
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: pnpm desktop:build
      - name: Build Linux installers
        if: runner.os == 'Linux'
        run: pnpm desktop:build
      - name: Test packaged app (macOS and Windows)
        if: runner.os != 'Linux'
        run: pnpm desktop:smoke
      - name: Test packaged app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm desktop:smoke
      - name: Verify Sparkle signatures, installation and relaunch
        if: runner.os == 'macOS'
        run: pnpm desktop:sparkle-test
      - name: Upload installers and update metadata
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml
            release/appcast-*.xml
      - name: Remove temporary notarization key
        if: always() && runner.os == 'macOS'
        run: rm -f "$RUNNER_TEMP/notarization.p8"

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: installers
      - name: Create a draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
            test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA"
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
          gh release create "$tag" installers/* --verify-tag --draft --title "pdfer $tag" --generate-notes
